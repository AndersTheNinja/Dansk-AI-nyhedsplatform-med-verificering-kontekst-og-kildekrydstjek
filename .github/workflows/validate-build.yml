name: Validate ØL.dk build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/article-preview-quality.test.mjs
      - run: node --experimental-strip-types --test tests/article-image-quality.test.mjs
      - run: node --experimental-strip-types --test tests/news-quality.test.mjs
      - run: node --experimental-strip-types --test tests/article-enrichment-metrics.test.mjs
      - run: node --test tests/tv2-feed.test.mjs
      - run: node --experimental-strip-types --test tests/article-access.test.mjs
      - run: npm run build
