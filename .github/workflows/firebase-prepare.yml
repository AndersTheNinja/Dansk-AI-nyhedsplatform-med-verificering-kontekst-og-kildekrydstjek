name: Prepare Firebase App Hosting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-prepare.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package.json
      - name: Generate missing package lock
        run: |
          if test ! -f package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Verify build with locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated lockfile
        run: |
          if test -n "$(git status --porcelain -- package-lock.json)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm lockfile for Firebase App Hosting"
            git push
          fi
